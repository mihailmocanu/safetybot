services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - safety_data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  safety_data:
